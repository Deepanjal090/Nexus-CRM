<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NEXUS — All-in-one business workspace for modern teams" />
    <title>NEXUS — Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Global Backend Health Monitor -->
    <div id="health-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,23,42,0.9); z-index: 99999; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: 'Outfit', sans-serif;">
      <div style="width: 50px; height: 50px; border: 4px solid rgba(0, 170, 255, 0.3); border-top-color: #00aaff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
      <h2 style="font-weight: 900; margin: 0;">Reconnecting to Server...</h2>
      <p style="color: #94a3b8; font-weight: 500;">The backend API is currently unreachable. Please wait.</p>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    <script>
      (function() {
        const overlay = document.getElementById('health-overlay');
        let isDown = false;
        setInterval(async () => {
          try {
            const res = await fetch('/api/v1');
            if (!res.ok && res.status >= 500) throw new Error('Backend 500');
            if (isDown) {
              isDown = false;
              overlay.style.display = 'none';
              window.location.reload(); // Hard reload when it comes back up
            }
          } catch (e) {
            isDown = true;
            overlay.style.display = 'flex';
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
