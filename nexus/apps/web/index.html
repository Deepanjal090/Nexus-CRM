<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NEXUS — All-in-one business workspace for modern teams" />
    <title>NEXUS — Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Global Backend Health Monitor (Toast Style) -->
    <div id="health-overlay" style="display: none; position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 99999; pointer-events: none;">
      <div style="background: rgba(15,23,42,0.95); backdrop-filter: blur(12px); padding: 12px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); color: white; display: flex; items-center: center; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); font-family: 'Outfit', sans-serif;">
        <div style="width: 16px; height: 16px; border: 2px solid rgba(0, 170, 255, 0.3); border-top-color: #00aaff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 13px; font-weight: 800; letter-spacing: -0.01em;">NEXUS Engine Reconnecting...</span>
          <span style="font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; tracking: 0.05em;">API currently unreachable</span>
        </div>
      </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    <script>
      (function() {
        const overlay = document.getElementById('health-overlay');
        let isDown = false;
        setInterval(async () => {
          try {
            const res = await fetch('/api/v1');
            if (!res.ok && res.status >= 500) throw new Error('Backend 500');
            if (isDown) {
              isDown = false;
              overlay.style.display = 'none';
              window.location.reload(); // Hard reload when it comes back up
            }
          } catch (e) {
            isDown = true;
            overlay.style.display = 'flex';
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
